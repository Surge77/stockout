[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockout"
version = "0.9.0"
description = "Retail sales and product demand prediction: store-day sales regression, Low/Medium/High demand classification, a CLI and a web app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TEJAS", email = "tejasdeshmane66@gmail.com" }]
keywords = [
    "retail",
    "demand-prediction",
    "sales-forecasting",
    "regression",
    "classification",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Pinned exactly. A portfolio repo that cannot be reproduced two years from now is
# not evidence of anything.
#
# seaborn is a runtime dependency rather than a notebook extra because `plots.py`
# imports it. The two xlsx source files were converted to csv once with the standard
# library, so openpyxl is deliberately absent.
dependencies = [
    "pandas==2.2.3",
    "numpy==2.4.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "kaggle==2.2.4",
]

[project.optional-dependencies]
# The web app is an extra: nothing in src/stockout/ imports FastAPI, and a plain
# install should not pull a web server for somebody who wants the models.
web = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "bcrypt==5.0.0",
    "itsdangerous==2.2.0",
]
notebook = ["jupyterlab==4.2.5", "ipykernel==7.3.0", "nbconvert==7.16.4"]
dev = [
    "ruff==0.16.3",
    "pyright==1.1.411",
    "pandas-stubs==3.0.5.260730",
    "pytest==9.0.3",
    "httpx2==2.12.0",
]

[project.urls]
Homepage = "https://github.com/Surge77/stockout"
Repository = "https://github.com/Surge77/stockout"
Issues = "https://github.com/Surge77/stockout/issues"

[project.scripts]
stockout = "stockout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockout = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
# Point at the in-repo virtualenv so the editor and the CLI resolve the same pandas.
venvPath = "."
venv = ".venv"
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# X_train / Y_test are the notebooks' own names, and capital X for a feature matrix is
# the scikit-learn convention throughout its own documentation. Renaming them to satisfy
# pep8 would make every function here read differently from the material it mirrors.
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["stockout"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F401"]
