name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Editable, so the tests import the package exactly as a user would. `dev`
        # pulls in the `gbm` extra: the gradient-boosted models are real code now, and
        # code CI cannot execute is code CI cannot measure. The smoke job below installs
        # the bare package instead, which is what keeps the lazy import honest.
        run: pip install -e ".[dev]"

      - name: Lint
        # `check` only. `ruff format` is never run here — see ADR 0004.
        run: ruff check .

      - name: Tests
        # Integration tests are excluded by pyproject's addopts; they need a Kaggle token
        # and acceptance of the competition rules, neither of which a fork can have.
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Types
        run: pyright

  smoke:
    # Proves the offline path a new clone actually takes. The unit tests could all pass
    # while the CLI was broken by a bad default, and this is what catches that.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Describe the committed sample
        run: |
          python -m stockout describe | tee describe.txt
          grep -q "trading days" describe.txt
          grep -q "calendar gaps" describe.txt

      - name: The baseline scores exactly 1.000 against itself
        # MASE is scaled by seasonal-naive, so seasonal-naive must score 1.000 by
        # identity. If this ever drifts, every other MASE in the repo is measuring
        # against something other than the baseline it claims.
        run: |
          python -m stockout backtest --model seasonal_naive | tee baseline.txt
          grep -q "MASE 1.000" baseline.txt
          grep -q "this \*is\* the seasonal-naive baseline" baseline.txt

      - name: Ignoring the weekday costs something
        run: |
          python -m stockout backtest --model naive_last | tee naive.txt
          grep -q "loses" naive.txt

      - name: Without the gbm extra, the model paths fail readably rather than crashing
        # This job installs the bare package on purpose. `frontier` and `calibration` are
        # the commands that need LightGBM, so they are also the proof that the import
        # really is lazy: the CLI must parse, load the data and then say what to install —
        # not raise ImportError at `import stockout`.
        run: |
          for command in frontier calibration; do
            if python -m stockout "$command" 2> "$command.txt"; then
              echo "expected a non-zero exit from $command without LightGBM installed"
              exit 1
            fi
            cat "$command.txt"
            grep -q "^error: LightGBM is not installed" "$command.txt"
            grep -q "\[gbm\]" "$command.txt"
          done

      - name: A model name that exists must be reachable from --help
        # The registry is the only place a forecaster's name is written down. If a model
        # is registered and the parser does not offer it, the CLI is lying about what it
        # can do — and the failure is silent until someone types the name.
        run: |
          python -m stockout frontier --help | tee frontier-help.txt
          grep -q "gbm_conformal" frontier-help.txt
          grep -q "lead-time" frontier-help.txt

      # The absence of a shuffled splitter is checked by tests/test_no_random_splits.py,
      # which parses the AST rather than grepping. A text search cannot distinguish code
      # from the docstrings explaining why the code is absent — the first version of this
      # step failed on exactly that, and on __pycache__ binaries.

  sample-drift:
    # The generator is deterministic, so a regenerated sample should be byte-identical.
    # A difference means the generator changed — which is allowed, and should be noticed.
    # Warns rather than fails: a deliberate change must not block a merge.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Regenerate and compare
        run: |
          cp data/sample_sales.csv /tmp/committed.csv
          python scripts/make_sample.py
          if ! diff -q /tmp/committed.csv data/sample_sales.csv > /dev/null; then
            echo "::warning::data/sample_sales.csv is stale — run scripts/make_sample.py and commit the result"
          fi
