name: Question
description: Ask about how something works or why it was done a particular way
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Worth checking first — most "why is it like this" answers are already written down:

        - [docs/decisions/](../../docs/decisions/) — seven ADRs, each with its cost
        - [docs/glossary.md](../../docs/glossary.md) — forecasting and inventory terms
        - [docs/data-dictionary.md](../../docs/data-dictionary.md) — columns and their traps

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What you have tried or read
